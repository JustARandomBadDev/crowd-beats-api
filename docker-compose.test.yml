services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crowdbeats_test
      POSTGRES_PASSWORD: crowdbeats_test
      POSTGRES_DB: crowdbeats_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdbeats_test -d crowdbeats_test"]
      interval: 2s
      timeout: 2s
      retries: 15
