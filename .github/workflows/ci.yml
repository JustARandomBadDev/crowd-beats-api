name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crowdbeats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crowdbeats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run unit tests
        run: go test ./...

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crowdbeats?sslmode=disable
        run: go test -tags=integration ./...

      - name: Build binaries
        run: go build ./...

      - name: Build Docker image
        run: docker build -t crowd-beats-api:ci .
