services:
  postgres:
    image: postgres:16-alpine
    container_name: crowdbeats-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crowdbeats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crowdbeats"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdbeats-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/crowdbeats?sslmode=disable"
      AUTO_MIGRATE: "true"
      ALLOWED_ORIGINS: "*"
      SEARCH_CACHE_TTL: "30s"
      SHUTDOWN_TIMEOUT: "10s"
      DEFAULT_RECALC_INTERVAL: "5s"
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET:-}"
      SPOTIFY_TOKEN_URL: "${SPOTIFY_TOKEN_URL:-https://accounts.spotify.com/api/token}"
      SPOTIFY_API_BASE: "${SPOTIFY_API_BASE:-https://api.spotify.com/v1}"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
