name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crowdbeats_test
          POSTGRES_PASSWORD: crowdbeats_test
          POSTGRES_DB: crowdbeats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crowdbeats_test -d crowdbeats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build binaries
        run: go build ./...

      - name: Run unit tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race-sensitive tests
        run: go test -race ./internal/infra/ws ./internal/infra/scheduler ./internal/usecase

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://crowdbeats_test:crowdbeats_test@localhost:5432/crowdbeats_test?sslmode=disable
          ALLOW_INTEGRATION_DB_RESET: "true"
        run: go test -tags=integration ./...

      - name: Build Docker image
        run: docker build -t crowd-beats-api:ci .
